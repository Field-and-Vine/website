name: Deploy to Development

# The development environment holds this deploy's WP Engine environment name
# (variable WPE_ENV), the site address (variable SITE_URL) and its own deploy
# key (secret WPE_SSHG_KEY_PRIVATE), whose WP Engine user reaches Development
# only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Require the environment's settings
        env:
          WPE_ENV: ${{ vars.WPE_ENV }}
        run: |
          if [ -z "$WPE_ENV" ]; then
            echo "The development environment has no WPE_ENV variable." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PHP syntax and refuse symbolic links
        run: |
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
          if [ -n "$(find . -path ./.git -prune -o -type l -print)" ]; then
            echo "Symbolic links are not deployed; replace them with files." >&2
            exit 1
          fi

      # The theme sync adds --delete to the action's default flags, so the
      # server's theme folder matches the repository's: files removed from the
      # theme here are removed there. Deletion stays inside that folder, which
      # REMOTE_PATH names; the trailing slashes on both paths keep it there.
      - name: Deploy theme
        uses: wpengine/github-action-wpe-site-deploy@9192d288134986f65e5b13c49d41fdaf7f30e56d # v4.0.0
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV }}
          SRC_PATH: wp-content/themes/field-and-vine/
          REMOTE_PATH: wp-content/themes/field-and-vine/
          FLAGS: "-azvr --inplace --delete --exclude='.*'"
          CACHE_CLEAR: FALSE

      # The plugin sync keeps the default flags (no --delete), so it writes
      # the one file and removes nothing else in mu-plugins.
      - name: Deploy Development must-use plugin and clear caches
        uses: wpengine/github-action-wpe-site-deploy@9192d288134986f65e5b13c49d41fdaf7f30e56d # v4.0.0
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV }}
          SRC_PATH: wp-content/mu-plugins/field-and-vine-development-application-password-header.php
          REMOTE_PATH: wp-content/mu-plugins/
          CACHE_CLEAR: TRUE
